name: Deploy public copy

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, macOS]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: make test
      - name: Build redacted artifact
        run: make build
      - name: Publish static copy
        run: make deploy
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Sync live artifact to Google Sheets
        env:
          GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE: ${{ vars.GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE }}
          GOOGLE_WORKSPACE_PROJECT_ID: ${{ vars.GOOGLE_WORKSPACE_PROJECT_ID }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
        run: make sync-sheets

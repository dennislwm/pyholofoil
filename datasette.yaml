databases:
  products:
    queries:
      copy-to-overrides:
        sql: |-
          INSERT INTO products_overrides (
            id, product_name, set_name, brand_name, discriminator, rarity,
            quantity, value_total, value_per_unit, value_currency,
            paid_total, paid_per_unit, paid_currency, grade_type,
            grade_subtype, group_name, group_wishlist, tcgplayer_id,
            pricecharting_id, doubleholo_id, date_added, tag
          )
          SELECT
            id, product_name, set_name, brand_name, discriminator, rarity,
            quantity, value_total, value_per_unit, value_currency,
            paid_total, paid_per_unit, paid_currency, grade_type,
            grade_subtype, group_name, group_wishlist, tcgplayer_id,
            pricecharting_id, doubleholo_id, date_added, tag
          FROM products WHERE id = :id
          ON CONFLICT(id) DO NOTHING
        write: true
        on_success_redirect: /products/products_overrides
      copy-to-overrides-sold:
        sql: |-
          INSERT INTO products_overrides_sold (id, product_name, set_name, brand_name, discriminator, rarity, quantity, value_total, value_per_unit, value_currency, paid_total, paid_per_unit, paid_currency, grade_type, grade_subtype, group_name, group_wishlist, tcgplayer_id, pricecharting_id, doubleholo_id, date_added, tag)
          SELECT id, product_name, set_name, brand_name, discriminator, rarity, quantity, value_total, value_per_unit, value_currency, paid_total, paid_per_unit, paid_currency, grade_type, grade_subtype, group_name, group_wishlist, tcgplayer_id, pricecharting_id, doubleholo_id, date_added, tag FROM products WHERE id = :id
          ON CONFLICT(id) DO NOTHING
        write: true
        on_success_redirect: /products/products_overrides_sold
      backfill-null-extra-columns-sold:
        sql: |-
          UPDATE products_overrides_sold SET
            date_sold = COALESCE(date_sold, ''),
            sold_quantity = COALESCE(sold_quantity, ''),
            sold_value_total = COALESCE(sold_value_total, ''),
            sold_value_per_unit = COALESCE(sold_value_per_unit, ''),
            sold_remarks = COALESCE(sold_remarks, '')
        write: true
        on_success_redirect: /products/products_overrides_sold
      copy-to-overrides-sealed:
        sql: |-
          INSERT INTO products_overrides_sealed (id, product_name, set_name, brand_name, discriminator, rarity, quantity, value_total, value_per_unit, value_currency, paid_total, paid_per_unit, paid_currency, grade_type, grade_subtype, group_name, group_wishlist, tcgplayer_id, pricecharting_id, doubleholo_id, date_added, tag)
          SELECT id, product_name, set_name, brand_name, discriminator, rarity, quantity, value_total, value_per_unit, value_currency, paid_total, paid_per_unit, paid_currency, grade_type, grade_subtype, group_name, group_wishlist, tcgplayer_id, pricecharting_id, doubleholo_id, date_added, tag FROM products WHERE id = :id
          ON CONFLICT(id) DO NOTHING
        write: true
        on_success_redirect: /products/products_overrides_sealed
    tables:
      products:
        permissions:
          insert-row: false
          update-row: false
          delete-row: false
          alter-table: false
          drop-table: false
      products_overrides:
        permissions:
          insert-row:
            id: operator
          update-row:
            id: operator
          delete-row:
            id: operator
      products_overrides_sold:
        permissions:
          insert-row:
            id: operator
          update-row:
            id: operator
          delete-row:
            id: operator
        x-overrides-extra-columns:
        - date_sold
        - sold_quantity
        - sold_value_total
        - sold_value_per_unit
        - sold_remarks
x-overrides-tables:
- sealed
- sold
plugins:
  datasette-auth-passwords:
    operator_password_hash:
      $env: DATASETTE_OPERATOR_PASSWORD_HASH

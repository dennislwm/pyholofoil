# Per ADR-27: columns listed under "_global" are redacted from every
# table's public copy; a per-table key (the source-table name, e.g.
# products_merged_sold) adds columns redacted only for that table.
# Populating this is a manual, operator-owned business/privacy judgment
# call (REQ-018) -- nothing here is derived automatically.
#
# Per REQ-032: "rows" is an optional WHERE fragment, same _global/per-table
# shape as columns -- filters which rows reach the public copy. Only rows
# matching every declared "rows" fragment (global AND per-table, when both
# are set) are kept; omitting "rows" keeps every row.
_global:
  columns:
    - id
    - grade_type
    - paid_currency
    - grade_subtype
    - group_name
    - group_wishlist
    - tag
    - doubleholo_id
    - discriminator
    - last_updated
    - brand_name
    - value_total
    - value_currency
    - paid_total
products_merged_sealed:
  columns:
    - rarity
    - tcgplayer_id
    - pricecharting_id
  rows: "rarity = 'Sealed'"